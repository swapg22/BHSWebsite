name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./data/bhs.db
      PAYLOAD_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      APP_SIGNING_SECRET: ci-only-signing-0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:int
      - run: npm run setup && npm run seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  postgres:
    # Runs the committed migrations and the seed against real PostgreSQL 16 (section 16)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      PAYLOAD_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      APP_SIGNING_SECRET: ci-only-signing-0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run setup && npm run seed
      - run: npm run db:check
